<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14243b" />
      <stop offset="100%" stop-color="#0c1726" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#ffffff" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Outer circle border -->
  <circle cx="256" cy="256" r="246" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="6" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.6" stroke-dasharray="8 6" />

  <!-- Central Stem / Pillar -->
  <path d="M256 128 L256 420" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
  
  <!-- Base Stand -->
  <path d="M220 420 L292 420" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
  <path d="M236 395 L276 395" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />

  <!-- Top Star -->
  <polygon points="256,76 266,104 296,104 271,122 281,150 256,132 231,150 241,122 216,104 246,104" fill="#ffffff" filter="url(#glow)" />

  <!-- Symmetrical Branching / Trident / Wings -->
  <!-- Left Inner Branch -->
  <path d="M256 360 C210 360 170 310 170 250 C170 190 200 150 240 135" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" />
  <path d="M240 135 C248 155 240 180 220 200 C205 215 195 240 200 270 C206 300 230 325 256 330" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" />

  <!-- Right Inner Branch -->
  <path d="M256 360 C302 360 342 310 342 250 C342 190 312 150 272 135" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" />
  <path d="M272 135 C264 155 272 180 292 200 C307 215 317 240 312 270 C306 300 282 325 256 330" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" />

  <!-- Outer Protective Petals / Radar Waves -->
  <path d="M150 240 C140 180 180 120 220 95 C200 130 200 180 225 210" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" opacity="0.9" />
  <path d="M362 240 C372 180 332 120 292 95 C312 130 312 180 287 210" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" opacity="0.9" />
</svg>
